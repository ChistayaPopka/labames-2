name: fedor-site
services:
  web:
    image: nginx:1.30
    container_name: fedor-site-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
